name: Update Profile Art Daily

on:
  schedule:
    - cron: '0 0 * * *'  # Runs daily at midnight UTC
  workflow_dispatch:      # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  update-heatmap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Fetch Live Contribution Data
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: |
          python scripts/fetch_contributions.py --username "$GITHUB_USERNAME"

      - name: Render Animated Heatmap SVG
        run: |
          python scripts/render_heatmap_svg.py

      - name: Commit and Push Updated Heatmap
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add contrib-heatmap.svg data/contributions.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update contribution heatmap SVG [skip ci]" && git push)
